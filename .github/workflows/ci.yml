name: CI

on:
  pull_request:
  push:
    branches: [main, develop, 'sync/**']
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Native deps (OpenVPN 3)
        run: brew install asio cmake fmt lz4 xxhash openssl@3 pkg-config

      - name: Build OpenVPN engine
        run: |
          cmake -S engine -B build-engine \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build build-engine --parallel
          test -f build-engine/libovpn3-core.a
          test -f build-engine/libjsoncpp.a

      - name: Build libXray
        run: |
          scripts/bootstrap-go.sh
          scripts/build-libxray.sh

      - name: Build and test
        working-directory: DataGateMac
        run: |
          rc=0
          xcodebuild test \
            -project DataGateMac.xcodeproj \
            -scheme DataGateMac \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            'OTHER_CPLUSPLUSFLAGS=$(inherited) -include fmt/format.h' > ../build.log 2>&1 || rc=$?
          grep -E -A4 ' error: |Undefined symbols|^ld: |Test Case .* failed|\*\* (BUILD|TEST)|Executed [0-9]+ test' ../build.log | head -300
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
